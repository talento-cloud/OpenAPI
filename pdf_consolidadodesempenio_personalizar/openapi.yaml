openapi: 3.0.0
info:
  title: Artes Desempenio Consolidado
  description: >-
    Contiene endpoints utilizados para personalizar reporte pdf consolidado de desempeño

    ## Manejo de errores


        Los errores habituales pueden incluir:


        - `400 Bad Request`: Parámetros requeridos faltantes o con formato
        inválido.
            
        - `401 Unauthorized`: Token JWT inválido, expirado o ausente.
            
        - `403 Forbidden`: El usuario autenticado no tiene permisos suficientes.
            
        - `404 Not Found`: El recurso solicitado no existe.
            
        - `500 Internal Server Error`: Error inesperado en el servidor.
            

        Cuando sea posible, cada endpoint detallará sus códigos de error
        específicos y estructura de respuesta en su propia descripción.
  contact: {}
  version: '1.0'
servers:
- url: https://clientex.talento.cloud/api/html
  description: Servidor de producción     
- url: https://clientex.talento-dev.cloud/api/html
  description: Servidor de pruebas
  variables: {}
paths:
  /mapatalento/modelosmapatalento.json:
    get:
      tags:
      - PDF
      summary: Modelos Mapa Talento
      description: Lista los modelos de mapa de talento que se han creado en la plataforma
      operationId: ModelosMapaTalento
      parameters: []
      responses:
        '200':
          description: OK
          headers:
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Origin
            Content-Language:
              content:
                text/plain:
                  schema:
                    type: string
                  example: es-CO
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                  example: no-store
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                  example: 1; mode=block
            X-Frame-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: DENY
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: nosniff
            Content-Security-Policy:
              content:
                text/plain:
                  schema:
                    type: string
                  example: frame-ancestors 'self' https://*.talento-dev.cloud https://*.talento.cloud http://localhost:*
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                  example: chunked
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Jetty(8.y.z-SNAPSHOT)
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/modelosMapaTalento'
      deprecated: false
  /mapatalento/pdf/elementosPDF/{codModeloMapaTalento}.json:
    get:
      tags:
      - PDF
      summary: Elementos PDF
      description: Lista los elementos que puede tener un reporte pdf de consolidado desempeño
      operationId: ElementosPDF
      parameters: 
        - name: codModeloMapaTalento
          in: path
          required: true
          description: Codigo del modelo de mapa de talento
          schema:
            type: string
            example: 1
      responses:
        '200':
          description: OK
          headers:
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Origin
            Set-Cookie:
              content:
                text/plain:
                  schema:
                    type: string
                  example: JSESSIONID=18yy7namgjafl1dxz7mqumxaxo;Path=/
            Expires:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Thu, 01 Jan 1970 00:00:00 GMT
            Content-Language:
              content:
                text/plain:
                  schema:
                    type: string
                  example: es-CO
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                  example: no-store
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                  example: 1; mode=block
            X-Frame-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: DENY
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: nosniff
            Content-Security-Policy:
              content:
                text/plain:
                  schema:
                    type: string
                  example: frame-ancestors 'self' https://*.talento-dev.cloud https://*.talento.cloud http://localhost:*
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                  example: chunked
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Jetty(8.y.z-SNAPSHOT)
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/elementosPDF'
                - example:
                    success: true
                    elementos:
                    - conMembrete: true
                      conTextoPersonalizable: false
                      id: CONSOLIDADO_DESEMPENIO_INDV_GRAL
                      nombre: Hoja general
                    - conMembrete: true
                      conTextoPersonalizable: false
                      id: CONSOLIDADO_DESEMPENIO_INDV_PORTADA
                      nombre: Portada
                    - conMembrete: true
                      conTextoPersonalizable: false
                      id: CONSOLIDADO_DESEMPENIO_INDV_CONTRAPORTADA
                      nombre: Contra portada
                    - textoPersonalizable: "<div class=\"introduccion-text\">\nEstimado [nombre_colaborador],\n<br/><br/>\nTe presentamos tu <b>REPORTE INDIVIDUAL CONSOLIDADO DE DESEMPEÑO</b>. \n<br/><br/>\nDurante este periodo, analizaste con tu líder tus <b>RESULTADOS</b> según tu evaluación de objetivos y tus <b>HABILIDADES</b> a partir en la evaluación de competencias. Estos datos nos permiten evaluar tu <b>PARTICIPACIÓN</b> y diseñar un plan de crecimiento para aprovechar tus <b>FORTALEZAS</b> y enfrentar los desafíos de la compañía.\n<br/><br/>\nCada acción de desarrollo que acuerdes con tu líder durante la retroalimentación debe centrarse en mejorar tus habilidades y alinear tu contribución con los objetivos de tu equipo, con el fin de alcanzar los mejores resultados posibles.\n<br/><br/>\nCordialmente,\n<br/><br/>\n[nombre_empresa].\n</div>"
                      conMembrete: true
                      conTextoPersonalizable: true
                      id: CONSOLIDADO_DESEMPENIO_INDV_INTRODUCCION
                      nombre: Introducción
                    - notas: Este membrete puede no existir, y de ser así esta hoja no se imprime en el pdf
                      conMembrete: true
                      conTextoPersonalizable: false
                      id: CONSOLIDADO_DESEMPENIO_INDV_EXPLICACION
                      nombre: Hoja explicación
                    - textoPersonalizable: ''
                      conMembrete: true
                      conTextoPersonalizable: true
                      id: CONSOLIDADO_DESEMPENIO_INDV_FORTALEZAS
                      nombre: Fortalezas
                    - textoPersonalizable: >-
                        <div class="resultado-competencias-text">

                        A continuación, te presentamos los resultados de tu evaluación de competencias. Te invitamos a revisar y analizar detalladamente cada punto del informe.

                        <br/><br/>

                        Es importante que tengas en cuenta que el propósito principal de este ejercicio es obtener una retroalimentación completa sobre tu gestión diaria. Esta retroalimentación será la base para elaborar planes de trabajo y definir acciones en colaboración con tu líder, con el objetivo de impulsar tu desarrollo y crecimiento.

                        <br/><br/>

                        Te recomendamos recibir esta información con objetividad y disposición para aprender, ya que solo al identificar tus fortalezas y áreas de mejora podrás definir acciones que impulsen tu desarrollo integral y te ayuden a alcanzar las metas establecidas.

                        </div>
                      conMembrete: true
                      conTextoPersonalizable: true
                      id: CONSOLIDADO_DESEMPENIO_RESULTADO_COMPETENCIAS
                      nombre: Resultado general de competencias
                    - textoPersonalizable: >-
                        <div class="resumen-resultado-competencias-text">

                        Te presentamos el resumen de las competencias evaluadas para tu rol y resultado obtenido por rol evaluador.<br/>

                        Podrás ver un comparativo por:

                        <ul>
                            <li><b>Promedio del Cargo: </b> Promedio del resultado de la evaluación para todos los cargos de tu mismo nivel organizacional.</li>
                            <li><b>Valor Logrado: </b> Promedio total del resultado de la evaluación realizada por todos tus evaluadores.</li>
                        </ul>

                        </div>
                      conMembrete: true
                      conTextoPersonalizable: true
                      id: CONSOLIDADO_DESEMPENIO_RESUMEN_RESULTADO_COMPETENCIAS
                      nombre: Resumen resultado de competencias
                    - textoPersonalizable: >-
                        <div class="comentarios-competencias-text">

                        <b>A continuación encontrarás cada uno de los comentarios de las personas que te evaluaron:</b>

                        </div>
                      conMembrete: true
                      conTextoPersonalizable: true
                      id: CONSOLIDADO_DESEMPENIO_COMENTARIOS_COMPETENCIAS
                      nombre: Comentarios del proceso de evaluación competencias
                    - textoPersonalizable: "<div class=\"indicadores-objetivos-text\">\nEn esta sección se detallan los objetivos establecidos para el periodo evaluado, los cuales fueron monitoreados junto con tu líder a lo largo del año para garantizar su logro. \n<br/><br/>\nLa información que se tiene en cuenta para el cálculo de tus <b>indicadores</b>, corresponde a los datos registrados en la fase evaluativa, de acuerdo con el cumplimiento y cierre total de año de cada objetivo.\n</div>"
                      conMembrete: true
                      conTextoPersonalizable: true
                      id: CONSOLIDADO_DESEMPENIO_INDICADORES_OBJETIVOS
                      nombre: Indicadores objetivos
                    - conMembrete: true
                      conTextoPersonalizable: false
                      id: CONSOLIDADO_DESEMPENIO_INDV_RESULTADOGRAL
                      nombre: Resultado general consolidado desempeño
                    - jsonColores:
                        colorTextoTituloPpal: '#2C86D4'
                        colorFondoTituloPpal: '#011826'
                        colorTextoTituloSecond: '#2C86D4'
                        colorTextoGeneral: '#444444'
                        colorTextoPortada: '#ff4444'
                      conMembrete: false
                      conTextoPersonalizable: false
                      id: CONSOLIDADO_DESEMPENIO_COLORES_TEXTO
                      nombre: Indicadores objetivos
              example:
                success: true
                elementos:
                - conMembrete: true
                  conTextoPersonalizable: false
                  id: CONSOLIDADO_DESEMPENIO_INDV_GRAL
                  nombre: Hoja general
                - conMembrete: true
                  conTextoPersonalizable: false
                  id: CONSOLIDADO_DESEMPENIO_INDV_PORTADA
                  nombre: Portada
                - conMembrete: true
                  conTextoPersonalizable: false
                  id: CONSOLIDADO_DESEMPENIO_INDV_CONTRAPORTADA
                  nombre: Contra portada
                - textoPersonalizable: "<div class=\"introduccion-text\">\nEstimado [nombre_colaborador],\n<br/><br/>\nTe presentamos tu <b>REPORTE INDIVIDUAL CONSOLIDADO DE DESEMPEÑO</b>. \n<br/><br/>\nDurante este periodo, analizaste con tu líder tus <b>RESULTADOS</b> según tu evaluación de objetivos y tus <b>HABILIDADES</b> a partir en la evaluación de competencias. Estos datos nos permiten evaluar tu <b>PARTICIPACIÓN</b> y diseñar un plan de crecimiento para aprovechar tus <b>FORTALEZAS</b> y enfrentar los desafíos de la compañía.\n<br/><br/>\nCada acción de desarrollo que acuerdes con tu líder durante la retroalimentación debe centrarse en mejorar tus habilidades y alinear tu contribución con los objetivos de tu equipo, con el fin de alcanzar los mejores resultados posibles.\n<br/><br/>\nCordialmente,\n<br/><br/>\n[nombre_empresa].\n</div>"
                  conMembrete: true
                  conTextoPersonalizable: true
                  id: CONSOLIDADO_DESEMPENIO_INDV_INTRODUCCION
                  nombre: Introducción
                - notas: Este membrete puede no existir, y de ser así esta hoja no se imprime en el pdf
                  conMembrete: true
                  conTextoPersonalizable: false
                  id: CONSOLIDADO_DESEMPENIO_INDV_EXPLICACION
                  nombre: Hoja explicación
                - textoPersonalizable: ''
                  conMembrete: true
                  conTextoPersonalizable: true
                  id: CONSOLIDADO_DESEMPENIO_INDV_FORTALEZAS
                  nombre: Fortalezas
                - textoPersonalizable: >-
                    <div class="resultado-competencias-text">

                    A continuación, te presentamos los resultados de tu evaluación de competencias. Te invitamos a revisar y analizar detalladamente cada punto del informe.

                    <br/><br/>

                    Es importante que tengas en cuenta que el propósito principal de este ejercicio es obtener una retroalimentación completa sobre tu gestión diaria. Esta retroalimentación será la base para elaborar planes de trabajo y definir acciones en colaboración con tu líder, con el objetivo de impulsar tu desarrollo y crecimiento.

                    <br/><br/>

                    Te recomendamos recibir esta información con objetividad y disposición para aprender, ya que solo al identificar tus fortalezas y áreas de mejora podrás definir acciones que impulsen tu desarrollo integral y te ayuden a alcanzar las metas establecidas.

                    </div>
                  conMembrete: true
                  conTextoPersonalizable: true
                  id: CONSOLIDADO_DESEMPENIO_RESULTADO_COMPETENCIAS
                  nombre: Resultado general de competencias
                - textoPersonalizable: >-
                    <div class="resumen-resultado-competencias-text">

                    Te presentamos el resumen de las competencias evaluadas para tu rol y resultado obtenido por rol evaluador.<br/>

                    Podrás ver un comparativo por:

                    <ul>
                        <li><b>Promedio del Cargo: </b> Promedio del resultado de la evaluación para todos los cargos de tu mismo nivel organizacional.</li>
                        <li><b>Valor Logrado: </b> Promedio total del resultado de la evaluación realizada por todos tus evaluadores.</li>
                    </ul>

                    </div>
                  conMembrete: true
                  conTextoPersonalizable: true
                  id: CONSOLIDADO_DESEMPENIO_RESUMEN_RESULTADO_COMPETENCIAS
                  nombre: Resumen resultado de competencias
                - textoPersonalizable: >-
                    <div class="comentarios-competencias-text">

                    <b>A continuación encontrarás cada uno de los comentarios de las personas que te evaluaron:</b>

                    </div>
                  conMembrete: true
                  conTextoPersonalizable: true
                  id: CONSOLIDADO_DESEMPENIO_COMENTARIOS_COMPETENCIAS
                  nombre: Comentarios del proceso de evaluación competencias
                - textoPersonalizable: "<div class=\"indicadores-objetivos-text\">\nEn esta sección se detallan los objetivos establecidos para el periodo evaluado, los cuales fueron monitoreados junto con tu líder a lo largo del año para garantizar su logro. \n<br/><br/>\nLa información que se tiene en cuenta para el cálculo de tus <b>indicadores</b>, corresponde a los datos registrados en la fase evaluativa, de acuerdo con el cumplimiento y cierre total de año de cada objetivo.\n</div>"
                  conMembrete: true
                  conTextoPersonalizable: true
                  id: CONSOLIDADO_DESEMPENIO_INDICADORES_OBJETIVOS
                  nombre: Indicadores objetivos
                - conMembrete: true
