                    colorTextoPortada: '#ff4444'
                  conMembrete: false
                  conTextoPersonalizable: false
                  id: CONSOLIDADO_DESEMPENIO_COLORES_TEXTO
                  nombre: Indicadores objetivos
      deprecated: false
  /mapatalento/pdf/editarElementosPDF/{codModeloMapaTalento}/{idElemento}/json:
    post:
      tags:
      - PDF
      summary: Editar Elemento PDF
      description: Para personalizar los elementos del pdf, los cuales encuentras en endpoint anterior, tener cuidado especial con CONSOLIDADO_DESEMPENIO_COLORES_TEXTO que recibe un json y no necesita membrete y tambien con CONSOLIDADO_DESEMPENIO_INDV_EXPLICACION que cuando no existe significa que esa hoja no se imprimirá en el pdf
      operationId: EditarElementoPDF
      parameters: 
        - name: codModeloMapaTalento
          in: path
          required: true
          description: Codigo del modelo de mapa de talento
          schema:
            type: string
            example: 1
        - name: idElemento
          in: path
          required: true
          description: Clave elemento a editar
          schema:
            type: string
            example: CONSOLIDADO_DESEMPENIO_INDV_INTRODUCCION    
      requestBody:
        content:
          multipart/form-data:
            encoding: {}
            schema:
              required:
              - archivoMembrete
              - textoPersonalizable
              - jsonColores
              type: object
              properties:
                archivoMembrete:
                  type: string
                  description: archivo png para membrete de hoja pdf, debe ser de 850x1100px, solo no requerido cuando es CONSOLIDADO_DESEMPENIO_COLORES_TEXTO
                  format: binary
                textoPersonalizable:
                  type: string
                  description: html simple de texto personalizado a usar en esa sección del pdf, requerido solo en algunos elementos que tienen personalizable el texto como CONSOLIDADO_DESEMPENIO_INDV_INTRODUCCION
                  example: <div class=\"introduccion-text\">Estimado [nombre_colaborador],<br/><br/>Te presentamos tu <b>REPORTE INDIVIDUAL CONSOLIDADO DE DESEMPEÑO editdo</b>. <br/><br/>Durante este periodo, analizaste con tu líder tus <b>RESULTADOS</b> según tu evaluación de objetivos y tus <b>HABILIDADES</b> a partir en la evaluación de competencias. Estos datos nos permiten evaluar tu <b>PARTICIPACIÓN</b> y diseñar un plan de crecimiento para aprovechar tus <b>FORTALEZAS</b> y enfrentar los desafíos de la compañía.<br/><br/>Cada acción de desarrollo que acuerdes con tu líder durante la retroalimentación debe centrarse en mejorar tus habilidades y alinear tu contribución con los objetivos de tu equipo, con el fin de alcanzar los mejores resultados posibles.<br/><br/>Cordialmente,<br/><br/>[nombre_empresa].</div>
                jsonColores:
                  allOf:
                  - $ref: '#/components/schemas/JsonColores'
                  - description: json usado en elemento CONSOLIDADO_DESEMPENIO_COLORES_TEXTO y solo es requerido en ese momento
                    example:
                      colorTextoTituloPpal: '#2C86D4'
                      colorFondoTituloPpal: '#011826'
                      colorTextoTituloSecond: '#2C86D4'
                      colorTextoGeneral: '#444444'
                      colorTextoPortada: '#ffffff'
        required: false
      responses:
        '200':
          description: OK
          headers:
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Origin
            Content-Language:
              content:
                text/plain:
                  schema:
                    type: string
                  example: es-CO
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                  example: no-store
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                  example: 1; mode=block
            X-Frame-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: DENY
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: nosniff
            Content-Security-Policy:
              content:
                text/plain:
                  schema:
                    type: string
                  example: frame-ancestors 'self' https://*.talento-dev.cloud https://*.talento.cloud http://localhost:*
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                  example: chunked
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Jetty(8.y.z-SNAPSHOT)
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/EditarElementoPDF'
                - example:
                    message: Los datos se almacenaron correctamente.
                    success: true
              example:
                message: Los datos se almacenaron correctamente.
                success: true
      deprecated: false
  /mapatalento/pdf/membrete/descargar/CONSOLIDADO_DESEMPENIO_INDV_INTRODUCCION/{codModeloMapaTalento}.png:
    get:
      tags:
      - PDF
      summary: Descargar Membrete
      description: Usado internamente por el generador de PDFs
      operationId: DescargarMembrete
      parameters: 
        - name: codModeloMapaTalento
          in: path
          required: true
          description: Codigo del modelo de mapa de talento
          schema:
            type: string
            example: 1
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
components:
  schemas:
    modelosMapaTalento:
      title: modelosMapaTalento
      required:
      - datos
      - cantidad
      type: object
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Dato'
          description: ''
        cantidad:
          type: integer
          format: int32
    Dato:
      title: Dato
      required:
      - activo
      - codigo
      - anioDesempenio
      - desempenioTerminado
      - evaluaciones
      - anios
      - nombre
      - escalaConsolidado
      - visibleFicha
      - ordenVisualizacion
      - intervalo1Filas
      - intervalo2Filas
      - intervalo3Filas
      - intervalo1Columnas
      - intervalo2Columnas
      - intervalo3Columnas
      - temporadaDesempenio
      - okrAnio
      - paraDEC
      - visibilidadPublica
      - paraGraficaPotencial
      - pbiResultadoWorkspace
      - pbiResultadoReporte
      - pbiResultadoProfile
      - pesoProceso1
      - pesoProceso2
      - tipo
      - mapaDesempeno
      - modeloParaFicha
      - extra
      - enProcceso
      - label
      type: object
      properties:
        activo:
          type: string
        codigo:
          type: integer
          format: int32
        anioDesempenio:
          type: integer
          format: int32
        desempenioTerminado:
          oneOf:
          - type: string
            nullable: true
          - type: boolean
          - nullable: true
        evaluaciones:
          type: string
          nullable: true
        anios:
          type: string
          nullable: true
        nombre:
          type: string
        escalaConsolidado:
          type: integer
          format: int32
        visibleFicha:
          type: boolean
        ordenVisualizacion:
          type: integer
          format: int32
        intervalo1Filas:
          type: integer
          format: int32
        intervalo2Filas:
          type: integer
          format: int32
        intervalo3Filas:
          type: integer
          format: int32
        intervalo1Columnas:
          type: integer
          format: int32
        intervalo2Columnas:
          type: integer
          format: int32
        intervalo3Columnas:
          type: integer
          format: int32
        temporadaDesempenio:
          oneOf:
          - allOf:
            - oneOf:
              - nullable: true
              - $ref: '#/components/schemas/TemporadaDesempenio'
            - {}
          - allOf:
            - $ref: '#/components/schemas/TemporadaDesempenio1'
            - example:
                accion: null
                idActor: null
                codigo: 550
                temporada: 4
                anio: 202200
                estado: n
                negocios:
                  codigo: -1
                  nombre: Todos los negocios
                  activo: n
                fechaAviso: null
                fechaCierre: 1738386000000
                fechaApertura: 1577854800000
                notificadoAviso: null
                notificadoCierre: s
                reporte: null
                plan: null
                temporadaAbierta: null
                label: 550Temporada
                idEntidad: 550
          - nullable: true
        okrAnio:
          type: string
          nullable: true
        paraDEC:
          type: boolean
        visibilidadPublica:
          oneOf:
          - type: boolean
            nullable: true
          - type: string
            nullable: true
          - nullable: true
        paraGraficaPotencial:
          type: boolean
        pbiResultadoWorkspace:
          type: string
          nullable: true
        pbiResultadoReporte:
          type: string
          nullable: true
        pbiResultadoProfile:
          type: string
          nullable: true
        pesoProceso1:
          type: integer
          format: int32
        pesoProceso2:
          type: integer
          format: int32
        tipo:
          type: string
        mapaDesempeno:
          type: string
          nullable: true
        modeloParaFicha:
          oneOf:
          - type: boolean
            nullable: true
