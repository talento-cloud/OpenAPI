    elementosPDF:
      title: elementosPDF
      required:
      - success
      - elementos
      type: object
      properties:
        success:
          type: boolean
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Elemento'
          description: ''
      example:
        success: true
        elementos:
        - conMembrete: true
          conTextoPersonalizable: false
          id: CONSOLIDADO_DESEMPENIO_INDV_GRAL
          nombre: Hoja general
        - conMembrete: true
          conTextoPersonalizable: false
          id: CONSOLIDADO_DESEMPENIO_INDV_PORTADA
          nombre: Portada
        - conMembrete: true
          conTextoPersonalizable: false
          id: CONSOLIDADO_DESEMPENIO_INDV_CONTRAPORTADA
          nombre: Contra portada
        - textoPersonalizable: "<div class=\"introduccion-text\">\nEstimado [nombre_colaborador],\n<br/><br/>\nTe presentamos tu <b>REPORTE INDIVIDUAL CONSOLIDADO DE DESEMPEÑO</b>. \n<br/><br/>\nDurante este periodo, analizaste con tu líder tus <b>RESULTADOS</b> según tu evaluación de objetivos y tus <b>HABILIDADES</b> a partir en la evaluación de competencias. Estos datos nos permiten evaluar tu <b>PARTICIPACIÓN</b> y diseñar un plan de crecimiento para aprovechar tus <b>FORTALEZAS</b> y enfrentar los desafíos de la compañía.\n<br/><br/>\nCada acción de desarrollo que acuerdes con tu líder durante la retroalimentación debe centrarse en mejorar tus habilidades y alinear tu contribución con los objetivos de tu equipo, con el fin de alcanzar los mejores resultados posibles.\n<br/><br/>\nCordialmente,\n<br/><br/>\n[nombre_empresa].\n</div>"
          conMembrete: true
          conTextoPersonalizable: true
          id: CONSOLIDADO_DESEMPENIO_INDV_INTRODUCCION
          nombre: Introducción
        - notas: Este membrete puede no existir, y de ser así esta hoja no se imprime en el pdf
          conMembrete: true
          conTextoPersonalizable: false
          id: CONSOLIDADO_DESEMPENIO_INDV_EXPLICACION
          nombre: Hoja explicación
        - textoPersonalizable: ''
          conMembrete: true
          conTextoPersonalizable: true
          id: CONSOLIDADO_DESEMPENIO_INDV_FORTALEZAS
          nombre: Fortalezas
        - textoPersonalizable: >-
            <div class="resultado-competencias-text">

            A continuación, te presentamos los resultados de tu evaluación de competencias. Te invitamos a revisar y analizar detalladamente cada punto del informe.

            <br/><br/>

            Es importante que tengas en cuenta que el propósito principal de este ejercicio es obtener una retroalimentación completa sobre tu gestión diaria. Esta retroalimentación será la base para elaborar planes de trabajo y definir acciones en colaboración con tu líder, con el objetivo de impulsar tu desarrollo y crecimiento.

            <br/><br/>

            Te recomendamos recibir esta información con objetividad y disposición para aprender, ya que solo al identificar tus fortalezas y áreas de mejora podrás definir acciones que impulsen tu desarrollo integral y te ayuden a alcanzar las metas establecidas.

            </div>
          conMembrete: true
          conTextoPersonalizable: true
          id: CONSOLIDADO_DESEMPENIO_RESULTADO_COMPETENCIAS
          nombre: Resultado general de competencias
        - textoPersonalizable: >-
            <div class="resumen-resultado-competencias-text">

            Te presentamos el resumen de las competencias evaluadas para tu rol y resultado obtenido por rol evaluador.<br/>

            Podrás ver un comparativo por:

            <ul>
                <li><b>Promedio del Cargo: </b> Promedio del resultado de la evaluación para todos los cargos de tu mismo nivel organizacional.</li>
                <li><b>Valor Logrado: </b> Promedio total del resultado de la evaluación realizada por todos tus evaluadores.</li>
            </ul>

            </div>
          conMembrete: true
          conTextoPersonalizable: true
          id: CONSOLIDADO_DESEMPENIO_RESUMEN_RESULTADO_COMPETENCIAS
          nombre: Resumen resultado de competencias
        - textoPersonalizable: >-
            <div class="comentarios-competencias-text">

            <b>A continuación encontrarás cada uno de los comentarios de las personas que te evaluaron:</b>

            </div>
          conMembrete: true
          conTextoPersonalizable: true
          id: CONSOLIDADO_DESEMPENIO_COMENTARIOS_COMPETENCIAS
          nombre: Comentarios del proceso de evaluación competencias
        - textoPersonalizable: "<div class=\"indicadores-objetivos-text\">\nEn esta sección se detallan los objetivos establecidos para el periodo evaluado, los cuales fueron monitoreados junto con tu líder a lo largo del año para garantizar su logro. \n<br/><br/>\nLa información que se tiene en cuenta para el cálculo de tus <b>indicadores</b>, corresponde a los datos registrados en la fase evaluativa, de acuerdo con el cumplimiento y cierre total de año de cada objetivo.\n</div>"
          conMembrete: true
          conTextoPersonalizable: true
          id: CONSOLIDADO_DESEMPENIO_INDICADORES_OBJETIVOS
          nombre: Indicadores objetivos
        - conMembrete: true
          conTextoPersonalizable: false
          id: CONSOLIDADO_DESEMPENIO_INDV_RESULTADOGRAL
          nombre: Resultado general consolidado desempeño
        - jsonColores:
            colorTextoTituloPpal: '#2C86D4'
            colorFondoTituloPpal: '#011826'
            colorTextoTituloSecond: '#2C86D4'
            colorTextoGeneral: '#444444'
            colorTextoPortada: '#ff4444'
          conMembrete: false
          conTextoPersonalizable: false
          id: CONSOLIDADO_DESEMPENIO_COLORES_TEXTO
          nombre: Indicadores objetivos
