openapi: 3.0.0
info:
  title: Sucesión
  description: >-
    Contiene endpoints utilizados para manejo de módulo de Sucesión y Matriz de criticidad

    ## Manejo de errores


        Los errores habituales pueden incluir:


        - `400 Bad Request`: Parámetros requeridos faltantes o con formato
        inválido.
            
        - `401 Unauthorized`: Token JWT inválido, expirado o ausente.
            
        - `403 Forbidden`: El usuario autenticado no tiene permisos suficientes.
            
        - `404 Not Found`: El recurso solicitado no existe.
            
        - `500 Internal Server Error`: Error inesperado en el servidor.
            

        Cuando sea posible, cada endpoint detallará sus códigos de error
        específicos y estructura de respuesta en su propia descripción.

        Ejemplos en Postman: https://booscloud.sharepoint.com/:u:/s/Talento/IQAH9MXP-F6KQIwfql9gnO4-AR8rixtrMZzlD2iGnDXA4uc?e=YCkctY 
  contact: {}
  version: '1.0'
servers:
- url: https://clientex.talento.cloud/api/html
  description: Servidor de producción     
- url: https://clientex.talento-dev.cloud/api/html
  description: Servidor de pruebas
  variables: {}
paths:
  /cargo/criticidad/getMatrizCriticidadResumen.json:
    get:
      tags:
      - MatrizCriticidad
      summary: getResumenMatrizCriticidad
      description: Endpoint para resumen con cantidad de cargos activos de la plataforma con conteo de matriz de criticidad
      operationId: getResumenMatrizCriticidad
      parameters:
      - name: moduloLider
        in: query
        description: Si true se lista solo cargos asociados al usuario en sesión por jefatura, por defecto false
        required: true
        style: form
        explode: true
        schema:
          type: boolean
          example: false
      - name: query
        in: query
        description: Filtro por nombre del cargo
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Asistente
      - name: cmbArea
        in: query
        description: Si se quiere filtrar por codigos de areas los cargos; no aplica en modoLider
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int32
          example:
          - 19
          - 17
      - name: cmbNiveles
        in: query
        description: Si se quiere filtrar por codigos de niveles organizaciones los cargos; no aplica en modoLider
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int32
          example:
          - 5
          - 6
          - 7
      - name: cmbUsuarioActivo
        in: query
        description: Si se quiere solo el cargo del usuario indicado; no aplica en modoLider
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          example: 374
      responses:
        '200':
          description: OK
          headers:
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Origin
            Content-Language:
              content:
                text/plain:
                  schema:
                    type: string
                  example: es-CO
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                  example: no-store
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                  example: 1; mode=block
            X-Frame-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: DENY
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: nosniff
            Content-Security-Policy:
              content:
                text/plain:
                  schema:
                    type: string
                  example: frame-ancestors 'self' https://*.talento-dev.cloud https://*.talento.cloud http://localhost:*
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                  example: chunked
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Jetty(8.y.z-SNAPSHOT)
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/getResumenMatrizCriticidad'
                - example:
                    empleados_con_riesgo: 4
                    cargos_criticos: 2
                    cargos_criticos_sin_sucesor: 1
                    success: true
                    empleados_clave: 5
              example:
                empleados_con_riesgo: 4
                cargos_criticos: 2
                cargos_criticos_sin_sucesor: 1
                success: true
                empleados_clave: 5
      deprecated: false
  /cargo/criticidad/getMatrizCriticidad.json:
    get:
      tags:
      - MatrizCriticidad
      summary: getMatrizCriticidad
      description: Endpoint para listar los cargos activos de la plataforma con información de matriz de criticidad
      operationId: getMatrizCriticidad
      parameters:
      - name: moduloLider
        in: query
        description: Si true se lista solo cargos asociados al usuario en sesión por jefatura, por defecto false
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          example: false
      - name: start
        in: query
        description: Paginación start, por defecto 0
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          example: 0
      - name: limit
        in: query
        description: Paginación limit, por defecto 50
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          example: 20
      - name: grupo
        in: query
        description: Para solo ver cargos EVALUADOS, SINEVALUAR o TODOS, por defecto TODOS
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: EVALUADOS
      responses:
        '200':
          description: OK
          headers:
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Origin
            Content-Language:
              content:
                text/plain:
                  schema:
                    type: string
                  example: es-CO
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                  example: no-store
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                  example: 1; mode=block
            X-Frame-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: DENY
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: nosniff
            Content-Security-Policy:
              content:
                text/plain:
                  schema:
                    type: string
                  example: frame-ancestors 'self' https://*.talento-dev.cloud https://*.talento.cloud http://localhost:*
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                  example: chunked
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Jetty(8.y.z-SNAPSHOT)
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/getMatrizCriticidad'
      deprecated: false
  /cargo/criticidad/listarUsuariosCriticidad.json:
