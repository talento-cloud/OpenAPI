  /plan-sucesion/move-user/{codCargo}/{codUsuario}/{catOrigen}/{catDestino}/false/false.json:
    post:
      tags:
      - PlanSucesión
      summary: moverUsuarioPlanSucesion
      description: Para mover un usuario en un cargo entre las diferentes categorias (SUCESOR, SUPLENTE, CANDIDATO), donde se indica la categoria origen y la categoria destino
      operationId: moverUsuarioPlanSucesion
      parameters: 
      - name: codCargo
        in: path
        required: true
        description: Código del cargo
        schema:
          type: integer
          example: 81
      - name: codUsuario
        in: path
        required: true
        description: Código del usuario
        schema:
          type: integer
          example: 181  
      - name: catOrigen
        in: path
        required: true
        description: Puede ser SUCESOR, SUPLENTE, CANDIDATO
        schema:
          type: string
          example: SUCESOR
      - name: catDestino
        in: path
        required: true
        description: Puede ser SUCESOR, SUPLENTE, CANDIDATO
        schema:
          type: string
          example: CANDIDATO          
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding: {}
            schema:
              required:
              - horizonteTiempo
              type: object
              properties:
                horizonteTiempo:
                  type: integer
                  description: Obligatorio solo si el destino es SUCESOR
                  format: int32
                  example: 4
        required: false
      responses:
        '200':
          description: OK
          headers:
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Origin
            Content-Language:
              content:
                text/plain:
                  schema:
                    type: string
                  example: es-CO
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                  example: no-store
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                  example: 1; mode=block
            X-Frame-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: DENY
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: nosniff
            Content-Security-Policy:
              content:
                text/plain:
                  schema:
                    type: string
                  example: frame-ancestors 'self' https://*.talento-dev.cloud https://*.talento.cloud http://localhost:*
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                  example: chunked
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Jetty(8.y.z-SNAPSHOT)
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/moverUsuarioPlanSucesion'
                - example:
                    message: Los usuarios se movieron exitosamente
                    success: true
                    movido: false
              example:
                message: Los usuarios se movieron exitosamente
                success: true
                movido: false
      deprecated: false
