  /api/html/v1/public/transversal/cargar/usuarios.json:
    post:
      tags:
      - Transversal
      summary: Transversal - Carga masiva de usuarios a partir de un arreglo JSON
      description: |
        Recibe un listado de usuarios en formato JSON y realiza su creación o actualización masiva en el sistema.

        **Procesamiento asíncrono.** La respuesta `202` confirma que la solicitud fue recibida e inició el procesamiento; **no indica que la carga haya terminado ni que todos los registros sean válidos**. El resultado final (cargas exitosas, advertencias y errores) se envía por correo electrónico al usuario asociado al cliente API y a los destinatarios configurados para el cliente.

        **Una carga a la vez.** Solo se procesa una carga por cliente en cada momento. Si hay otra en curso, el servicio responde `409` y la solicitud no se procesa; reintente cuando la anterior haya finalizado.

        **Requisitos.** El token debe incluir el permiso `talento.usuarios.write` y pertenecer a un cliente API habilitado para la carga de usuarios; de lo contrario se responde `403`.

        **Errores por registro.** Los errores de validación de cada registro no se retornan en la respuesta HTTP; se informan en el correo con el resultado de la carga.
      security:
        - oauth2:
            - talento.usuarios.write
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl --location --request POST 'https://clientex.talento-dev.cloud/api/html/v1/public/transversal/cargar/usuarios.json' \
              --header 'Content-Type: application/json' \
              --header 'Authorization: Bearer <TU_TOKEN_JWT>' \
              --data '[
                {
                  "primerNombre": "Carlos",
                  "primerApellido": "Perez",
                  "tipoDocumento": "CC",
                  "numeroDocumento": "1000000001",
                  "genero": "Masculino",
                  "email": "carlos.perez@empresa-ejemplo.com",
                  "empresa": "Empresa Ejemplo S.A.S.",
                  "cargo": "Analista Desarrollador",
                  "nivelOrganizacional": "Analistas",
                  "area": "TI",
                  "tipoUsuario": "Administrativo"
                }
              ]'
      operationId: Transversal-CargamasivadeusuariosapartirdeunarregloJSON
      requestBody:
        description: Listado de usuarios a cargar. Debe contener al menos un registro.
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DTOUsuarioCarga'
      responses:
        '202':
          description: Solicitud aceptada. La carga se procesa en segundo plano y el resultado final se notifica por correo electrónico.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CargaUsuariosAceptada'
              example:
                success: true
                message: El archivo está en proceso de validación y carga, el resultado será notificado via correo electrónico
                registros_recibidos: 120
        '400':
          description: El cuerpo de la solicitud no contiene registros de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: No se recibieron registros de usuarios para procesar.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: El token no tiene el permiso `talento.usuarios.write` o no pertenece a un cliente API habilitado para la carga de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: El usuario autenticado no tiene permisos suficientes.
        '409':
          description: Ya hay una carga de usuarios en proceso. La solicitud no se procesó; reintente cuando la carga en curso haya finalizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Hay una tarea sin terminar, espere a que finalice para realizar una nueva carga.
        '500':
          description: Error inesperado al recibir la solicitud. La carga no se inició.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaUsuariosError'
              example:
                success: false
                message: Ocurrió un error inesperado en el servidor.
                mensajes: []
      deprecated: false
