          type: string
          example: Token JWT inválido, expirado o ausente.    
  responses:
    UnauthorizedError:
      description: Token JWT inválido, expirado o ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token JWT inválido, expirado o ausente.
    ForbiddenError:
      description: El usuario autenticado no tiene permisos suficientes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: El usuario autenticado no tiene permisos suficientes.      
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://clientex.talento.cloud/api/html/oauth2/token/clientex.json
          scopes:            
            talento.seleccion.read: "Permiso para leer datos de selección. Todos los endpoints de Selección, incluido seguimiento por etapas"
            talento.hojavida.read: "Datos básicos y experiencia laboral"
            talento.hojavida.nomina.read: "Información de nómina, conceptos y novedades de nómina, y los campos sensibles: salario, banco y cuenta, grupo sanguíneo, etnia, discapacidad, peso y estatura"
            talento.transversal.read: "Reporte de todos los usuarios del sistema"
            talento.bienestar.read: "Beneficios, reconocimientos y puntos"
            talento.competencias.read: "Procesos y detalle de valoración"
            talento.formacion.read: "Años, temas y avance por tema"
            talento.dec.read: "Procesos, temporadas y reporte de operativos"
            talento.objetivossmart.read: "Procesos y resultados consolidados de gestión de objetivos SMART"
            talento.usuarios.write: "Carga masiva de usuarios"
            talento.read: "Permiso para leer datos de talento, está obsoleto y se removerá próximamente"
security:
- oauth2:
      - talento.hojavida.read
