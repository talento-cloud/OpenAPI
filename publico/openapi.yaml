  /api/html/v1/public/seleccion/get.json:
    get:
      tags:
      - Selección
      summary: Selección - Lista de requisiciones
      description: Retorna todos los procesos de selección **aprobados,** de forma paginada
      security:
        - oauth2:
            - talento.seleccion.read
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl --location 'https://clientex.talento-dev.cloud/api/html/v1/public/seleccion/get.json?start=0&limit=10' \
              --header 'Authorization: Bearer <TU_TOKEN_JWT>'
      operationId: Seleccion-ListaRequisiciones
