  /html/v1/public/transversal/cargar/usuarios.json:
    post:
      tags:
      - Transversal
      summary: Transversal - Carga masiva de usuarios a partir de un arreglo JSON
      description: |
        Endpoint que recibe un listado de usuarios en formato JSON y realiza la inserción o actualización masiva en el sistema.
        Procesa la información, crea tablas temporales, actualiza datos de los usuarios, e indica mediante correo electrónico el resultado de la carga masiva.
      security:
        - oauth2:
            - talento.usuarios.write
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl --location --request POST 'https://clientex.talento-dev.cloud/html/v1/public/transversal/cargar/usuarios.json' \
              --header 'Content-Type: application/json' \
              --header 'Authorization: Bearer <TU_TOKEN_JWT>' \
              --data '[
                {
                  "primerNombre": "Carlos",
                  "primerApellido": "Perez",
                  "tipoDocumento": "CC",
                  "numeroDocumento": "1000000001",
                  "genero": "Masculino",
                  "email": "carlos.perez@empresa-ejemplo.com",
                  "empresa": "Empresa Ejemplo S.A.S.",
                  "cargo": "Analista Desarrollador",
                  "nivelOrganizacional": "Analistas",
                  "area": "TI",
                  "tipoUsuario": "Administrativo"
                }
              ]'
      operationId: Transversal-CargamasivadeusuariosapartirdeunarregloJSON
      requestBody:
        description: Listado de usuarios a cargar.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DTOUsuarioCarga'
      responses:
        '200':
          description: Operación procesada. Devuelve un estado de éxito y un mensaje con el detalle de la ejecución de carga.
          content:
            application/json;charset=UTF-8:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indica si la operación inicial de carga fue exitosa.
                  message:
                    type: string
                    description: Mensaje con el resultado de la operación.
                  mensajes:
                    type: array
                    items:
                      type: string
                    description: Lista de mensajes de error o validación generados durante la carga masiva.
                example:
                  success: true
                  message: Proceso de carga masiva iniciado correctamente. Se enviará un correo con el resultado final.
                  mensajes: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          description: Error inesperado en la fase de carga e integración.
      deprecated: false
