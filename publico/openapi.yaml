    DTOUsuarioCarga:
      title: DTOUsuarioCarga
      type: object
      description: |
        Información del usuario a cargar.

        **Campos obligatorios.** Todo registro debe incluir: `primerNombre`, `primerApellido`, `tipoDocumento`, `numeroDocumento`, `empresa`, `cargo`, `categoriaCargo`, `nivelOrganizacional`, `area`, `sede`, `ciudad`, `departamento`, `pais`, `regional`, `negocio`, `uen`, `criticidades`, `vicepresidencia`, `numeroDocumentoJefe` y `tipoUsuario`. Un campo obligatorio vacío se reporta como error en el resultado de la carga.

        **Obligatorios según el caso:**
        - `numeroDocumentoJefe`: siempre se debe enviar. La única excepción es que el cliente tenga configurado conservar el jefe actual y el usuario ya exista con un jefe asignado. Debe corresponder a un usuario existente en el sistema.
        - `tipoDocumentoJefe`: obligatorio cuando se envía `numeroDocumentoJefe`.
        - `fechaIngreso` / `fechaInicioCargoActual`: para usuarios nuevos debe enviarse al menos una de las dos.
      required:
        - primerNombre
        - primerApellido
        - tipoDocumento
        - numeroDocumento
        - empresa
        - cargo
        - categoriaCargo
        - nivelOrganizacional
        - area
        - sede
        - ciudad
        - departamento
        - pais
        - regional
        - negocio
        - uen
        - criticidades
        - vicepresidencia
        - numeroDocumentoJefe
        - tipoUsuario
      properties:
        primerNombre:
          type: string
        otrosNombres:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        tipoDocumento:
          type: string
          description: |
            Tipo de documento del colaborador. Los valores base permitidos son:
            - CC: Cédula de ciudadanía
            - Cédula: Cédula de ciudadanía
            - CE: Cédula de extranjería
            - PP: Pasaporte
            - TI: Tarjeta de identidad
            - CG: Cédula Guatemala
            - NU: Número único nacional
            - RE: Registro civil
            - Registro: Registro civil
            - CURP
            - DL
            - PEP
            - RFC
            - RUN
            *Nota: Es posible crear nuevos tipos de documento por el administrador general (opción tipificadores).*

            Un valor que no corresponda a un tipo de documento existente se reporta como error. Si el usuario ya existe con otro tipo de documento, el registro también se reporta como error.
        numeroDocumento:
          type: string
          description: Número de documento del participante. No debe contener puntos ni separadores de miles. No puede repetirse dentro de la misma carga.
        genero:
          type: string
          description: Género del colaborador.
          enum: [Masculino, Femenino]
        email:
          type: string
          description: |
            Correo electrónico del colaborador. **No es obligatorio.** Si se omite, viene vacío o con formato inválido, el sistema conserva el correo que ya tiene el usuario o le asigna uno por defecto.
        empresa:
          type: string
        cargo:
          type: string
        nivelOrganizacional:
          type: string
          description: Nivel organizacional. En conjunto con el área, determina la singularidad del cargo en la organización.
        area:
          type: string
          description: Área del colaborador. En conjunto con el nivel organizacional, determina la singularidad del cargo.
        categoriaCargo:
          type: string
        criticidades:
          type: string
        sede:
          type: string
          description: Sede corporativa. Si hay sedes que se llamen igual, deben pertenecer a la misma ciudad.
        direccion:
          type: string
        ciudad:
          type: string
          description: Ciudad de la sede. Fundamental para diferenciar sedes que se llamen igual.
        departamento:
          type: string
        pais:
          type: string
        regional:
          type: string
        negocio:
          type: string
        uen:
          type: string
        numeroDocumentoJefe:
          type: string
          description: Número de documento del jefe directo. Obligatorio (ver excepción en la descripción del objeto). Debe ser un usuario existente en el sistema.
        tipoDocumentoJefe:
          type: string
          description: Tipo de documento del jefe directo. Admite los mismos valores que `tipoDocumento`.
        nombreJefe:
          type: string
          description: Nombre del jefe directo. Informativo; el jefe se identifica por su documento.
        fechaIngreso:
          type: string
          format: date
          description: Fecha de ingreso estructurada en formato aaaa-mm-dd (Ejemplo 2023-12-31). Para usuarios nuevos debe enviarse esta fecha o `fechaInicioCargoActual`.
        fechaInicioCargoActual:
          type: string
          format: date
          description: Fecha estructurada en formato aaaa-mm-dd (Ejemplo 2023-12-31). Para usuarios nuevos debe enviarse esta fecha o `fechaIngreso`.
        vicepresidencia:
          type: string
        tipoUsuario:
          type: string
          description: Tipo de usuario en el sistema.
          enum: [Administrativo, Operativo]
        escolaridad:
          type: string
          description: |
            Nivel de escolaridad. Valores permitidos:
            - Ninguna
            - Primaria
            - Bachiller
            - Técnico
            - Tecnólogo
            - Profesional
            - Especialista
            - Maestría
            - Doctorado
            - Posdoctorado
