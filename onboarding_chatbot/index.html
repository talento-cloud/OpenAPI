<html class="staticrypt-html" lang="es">
<head>
    <meta charset="utf-8" />
    <title>Talento Cloud - Acceso a Documentación</title>

    <!-- No cache -->

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.staticrypt-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
        }

        .staticrypt-content {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .staticrypt-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 24px;
        }

        .logo-container img {
            max-height: 50px;
            max-width: 100%;
            object-fit: contain;
        }

        .staticrypt-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .staticrypt-instructions {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .staticrypt-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-size: 0.85rem;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 18px;
            text-align: left;
        }

        .staticrypt-password-container {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .staticrypt-password-container input[type="password"],
        .staticrypt-password-container input[type="text"] {
            width: 100%;
            padding: 12px 42px 12px 14px;
            font-size: 0.95rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .staticrypt-password-container input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            background-color: #ffffff;
        }

        .staticrypt-toggle-password-visibility {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            opacity: 0.55;
            transition: opacity 0.2s;
        }

        .staticrypt-toggle-password-visibility:hover {
            opacity: 0.9;
        }

        .staticrypt-remember {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            color: #475569;
            margin-bottom: 22px;
            cursor: pointer;
            user-select: none;
        }

        .staticrypt-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            accent-color: #0284c7;
            cursor: pointer;
        }

        .staticrypt-decrypt-button {
            width: 100%;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: filter 0.2s, box-shadow 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2), 0 2px 4px -2px rgba(2, 132, 199, 0.2);
        }

        .staticrypt-decrypt-button:hover {
            filter: brightness(1.08);
            box-shadow: 0 6px 12px -2px rgba(2, 132, 199, 0.3);
        }

        .staticrypt-decrypt-button:active {
            transform: translateY(1px);
        }

        .staticrypt-decrypt-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .staticrypt-spinner-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .staticrypt-spinner {
            display: inline-block;
            width: 2.5rem;
            height: 2.5rem;
            border: 3px solid #e2e8f0;
            border-top-color: #0284c7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

            errorDiv.classList.add("hidden");
