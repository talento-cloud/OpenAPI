openapi: 3.0.0
info:
  title: Webhook de Talento Cloud para Secofa
  description: >-
    Info para el consumo de webhook en talento cloud por parte del proveedor Secofa.


    Para poder obtener el token deben usar el client_id y client_secret que se les suministrará.
    

    En la documentación se mencionan 2 urls:


        - Producción: https://[tenant].talento.cloud/

        - Pruebas: https://[tenant].talento-dev.cloud/


    ## Manejo de errores


        Los errores habituales pueden incluir:


        - `400 Bad Request`: Parámetros requeridos faltantes o con formato
        inválido.
            
        - `401 Unauthorized`: Token JWT inválido, expirado o ausente.
            
        - `403 Forbidden`: El usuario autenticado no tiene permisos suficientes.
            
        - `404 Not Found`: El recurso solicitado no existe.
            
        - `500 Internal Server Error`: Error inesperado en el servidor.
            

        Cuando sea posible, cada endpoint detallará sus códigos de error
        específicos y estructura de respuesta en su propia descripción.

  contact: {}
  version: '1.0'
servers:
- url: https://clientex.talento.cloud/api
  description: Servidor prod
  variables: {}
- url: https://clientex.talento-dev.cloud/api
  description: Servidor dev
  variables: {}  
paths:
  /html/oauth2/token/{tenant}.json:
    post:
      tags:
      - Misc
      summary: Oauth2 para obtener JWT
      description: >-
        El token generado solo tiene una vigencia de 15 minutos        


        ## Ejemplo petición con curl:

        ```bash

        curl -X POST https://landers.talento-dev.cloud/api/html/oauth2/token/landers.json \
          -H "Content-Type: application/x-www-form-urlencoded" \          
          -d "grant_type=client_credentials" \
          -d "client_id=webhook-servicio" \
          -d "client_secret=mi-secreto" \
          -d "scope=talento.write.candidato"

        ```

        ## Ejemplo uso token generado:

        ```bash

        curl -X POST https://landers.talento-dev.cloud/api/slc/secofa/webhook/landers \
          -H "Authorization: Bearer eyJhbGci..." \
          --data '{
            "id_estudio_generado": "15092026_9966310000",
            "archivo_base64": "JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQp4nJ1YyY7jNhC9..."
          }'
        ```      
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl -X POST https://landers.talento.cloud/html/oauth2/token/landers.json \
              -H "Content-Type: application/x-www-form-urlencoded" \          
              -d "grant_type=client_credentials" \
              -d "client_id=webhook-servicio" \
              -d "client_secret=mi-secreto" \
              -d "scope=talento.write.candidato"  
      operationId: oauth2
      parameters: 
        - name: tenant
          in: path
          description: Nombre del tenant, por ejemplo landers
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding: {}
            schema:
              required:
              - client_id
              - client_secret
              - grant_type
              - scope
              type: object
              properties:
                client_id:
                  type: string
                  example: 97b7ff796138dfafd06b68204ad76b6d
                  description: El client_id que se les suministró
                client_secret:
                  type: string
                  example: 430ca6bcb26f352b8f9e0c0e42f6a95e83d808cb17d5d7270515b939daaddb73
                  description: El client_secret que se les suministró
                grant_type:
                  type: string
                  description: Por defecto client_credentials
                  example: client_credentials
                scope:
                  type: string
                  description: Secofa debe usar talento.write.candidato
                  example: talento.write.candidato
        required: false
      responses:
        '200':
          description: OK
          headers:
            Vary:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Origin
            Content-Language:
              content:
                text/plain:
                  schema:
                    type: string
                  example: es-CO
            Cache-Control:
              content:
                text/plain:
                  schema:
                    type: string
                  example: no-store
            X-XSS-Protection:
              content:
                text/plain:
                  schema:
                    type: string
                  example: 1; mode=block
            X-Frame-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: DENY
            X-Content-Type-Options:
              content:
                text/plain:
                  schema:
                    type: string
                  example: nosniff
            Content-Security-Policy:
              content:
                text/plain:
                  schema:
                    type: string
                  example: frame-ancestors 'self' https://*.talento-dev.cloud https://*.talento.cloud http://localhost:*
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                  example: chunked
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Jetty(8.y.z-SNAPSHOT)
          content:
            application/json;charset=UTF-8:
              schema:
                allOf:
                - $ref: '#/components/schemas/oauth2'
                - example:
                    acces_token: eyJhbGciOiJIUzM4NCJ9.eyJzdW....
                    token_type: Bearer
                    expires_in: 900
                    success: true
                    scope: talento.write.candidato
              example:
                acces_token: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiJ0Y...
                token_type: Bearer
                expires_in: 900
                success: true
                scope: talento.write.candidato
      deprecated: false
      servers:
      - url: https://clientex.talento.cloud/api
        description: Servidor prod
        variables: {}
      - url: https://clientex.talento-dev.cloud/api
        description: Servidor dev
        variables: {}  
  /slc/secofa/webhook/{tenant}:
    post:
      tags:
      - Misc
      summary: WebHook para Secofa
      description: Endpoint del webhook para Secofa
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |
            curl --location 'https://somostalentoalianza.talento-dev.cloud/api/slc/secofa/webhook/{tenant}' \
              --header 'Authorization: Bearer <TU_TOKEN_JWT>' \
              --data '{
                "id_estudio_generado": "15092026_9966310000",
                "archivo_base64": "JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQp4nJ1YyY7jNhC9..."
              }'
      operationId: webHookSecofa
      parameters: 
        - name: tenant
          in: path
          description: Nombre del tenant
          required: true
          schema:
            type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/webHookSecofaRequest'
              - example:
                  id_estudio_generado: '15092026_9966310000'
                  archivo_base64: 'JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQp4nJ1YyY7jNhC9...'
            example:
              id_estudio_generado: '15092026_9966310000'
              archivo_base64: 'JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQp4nJ1YyY7jNhC9...'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/webHookSecofa'
                - example:
                    message: Datos del candidato de Secofa recibidos
                    success: true
                    idEstudioGenerado: '15092026_9966330000'
              example:
                message: Datos del candidato de Secofa recibidos
                success: true
                idEstudioGenerado: '15092026_9966330000'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'        
      deprecated: false
      servers:
      - url: https://clientex.talento.cloud/api
        description: Servidor prod
        variables: {}
      - url: https://clientex.talento-dev.cloud/api
        description: Servidor dev
        variables: {}  
components:
  schemas:
    oauth2:
      title: oauth2
      required:
      - acces_token
      - token_type
      - expires_in
      - success
      - scope
      type: object
      properties:
        acces_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int32
        success:
          type: boolean
        scope:
          type: string
      example:
        acces_token: eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiJ0YWxlbnRvLndyaXRlLmNhbmRpZGF0b3w5N2I3ZmY3OTYxMzhkZmFmZDA2YjY4MjA0YWQ3NmI2ZCIsInVzZXJJZCI6IjM0Iiwicm9sZSI6IldFQlNFUlZJQ0UiLCJleHBpcmUiOiIxNzc0MzgwNzU2NDQ1IiwiZW1wcmVzYSI6InRhbGVudG9fZGVtbyIsImxuZyI6ImVzIiwianRpIjoiNDE4MDM0ZjctMTQ1ZS00ZGQ2LTk4ZjMtYzc1YWMyMmI3YTIzIiwiaWF0IjoxNzc0Mzc5ODU3fQ.u4y60HfGC8sv3ZmFNZRSSO0-9grdxvWrjzZBA2f2dcXQReNHv5mubvjRUdDSu-Y4
        token_type: Bearer
        expires_in: 900
        success: true
        scope: talento.write.candidato
    webHookSecofaRequest:
      title: webHookSecofaRequest
      required:
      - id_estudio_generado
      - archivo_base64
      type: object
      properties:
        id_estudio_generado:
          type: string
          description: Identificador único del estudio generado.
          example: '15092026_9966310000'
        archivo_base64:
          type: string
          description: Archivo codificado en base64.
          example: 'JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQp4nJ1YyY7jNhC9...'
      example:
        id_estudio_generado: '15092026_9966310000'
        archivo_base64: 'JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQp4nJ1YyY7jNhC9...'
    webHookSecofa:
      title: webHookSecofa
      required:
      - message
      - success
      - idEstudioGenerado
      type: object
      properties:
        message:
          type: string
          description: Mensaje descriptivo de la operación.
          example: Datos del candidato de Secofa recibidos
        success:
          type: boolean
          description: Indica si la petición fue procesada con éxito.
          example: true
        idEstudioGenerado:
          type: string
          description: Identificador del estudio generado recibido.
          example: '15092026_9966330000'
      example:
        message: Datos del candidato de Secofa recibidos
        success: true
        idEstudioGenerado: '15092026_9966330000'
    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Token JWT inválido, expirado o ausente.        
  responses:        
    UnauthorizedError:
      description: Token JWT inválido, expirado o ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token JWT inválido, expirado o ausente.
    ForbiddenError:
      description: El usuario autenticado no tiene permisos suficientes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: El usuario autenticado no tiene permisos suficientes.       
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://clientex.talento.cloud/api/html/oauth2/token/demo.json
          scopes:
            talento.write.candidato: "Permiso para escribir datos en talento de un candidato"
security:
  - oauth2:
      - talento.write.candidato
tags:
- name: Misc
  description: 'Operaciones misceláneas'
